<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameCast — Remote Desktop Online</title>
<style>
  :root { --bg:#0f1117; --card:#171b26; --line:#262c3b; --txt:#e6e9f2; --dim:#8b93a7; --acc:#4f7cff; --gold:#f5b93e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--txt); display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header b { letter-spacing:.3px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:#666; display:inline-block; }
  header .dot.on { background:#2fd06a; box-shadow:0 0 8px #2fd06a; }
  header .badge { margin-left:auto; background:linear-gradient(135deg,#3a2d0e,#2a1f06); color:var(--gold);
    border:1px solid #6b4f14; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;
    display:none; letter-spacing:.5px; }
  header .usr { margin-left:auto; color:var(--dim); font-size:13px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  #card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:26px 24px; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  #card .logo { text-align:center; font-size:21px; font-weight:800; margin-bottom:4px; }
  #card .sub { text-align:center; color:var(--dim); font-size:13px; margin-bottom:18px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; background:#10131c; border-radius:10px; padding:4px; }
  .tab { flex:1; text-align:center; padding:8px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--dim); }
  .tab.on { background:var(--acc); color:#fff; font-weight:600; }
  .panel { display:none; }
  .panel.on { display:block; }
  input, button { background:#10131c; border:1px solid var(--line); color:var(--txt); border-radius:10px;
    padding:11px 13px; font-size:15px; width:100%; }
  input:focus { outline:none; border-color:var(--acc); }
  input::placeholder { color:var(--dim); }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  button { cursor:pointer; background:var(--acc); border-color:var(--acc); font-weight:700; font-size:14px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; border-color:var(--line); }
  #status, #err { color:var(--dim); font-size:13px; margin-top:12px; text-align:center; min-height:17px; }
  #err { color:#ff6b6b; }
  #devList { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .dev { display:flex; align-items:center; gap:10px; background:#10131c; border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; cursor:pointer; }
  .dev:hover { border-color:var(--acc); }
  .dev .dot2 { width:8px; height:8px; border-radius:50%; background:#666; flex:none; }
  .dev .dot2.on { background:#2fd06a; }
  .dev .info { flex:1; min-width:0; }
  .dev .info b { font-size:14px; display:block; }
  .dev .info span { font-size:12px; color:var(--dim); }
  .dev .tag { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .dev .tag.phone { color:var(--gold); border-color:#6b4f14; }
  .dev .tag.prem { color:var(--gold); border-color:#6b4f14; }
  #stage { width:100%; max-width:1080px; position:relative; background:#000; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); aspect-ratio:16/9; display:none; margin-top:16px; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  #hint { position:absolute; left:10px; bottom:10px; color:#fff; background:rgba(0,0,0,.55);
    padding:4px 10px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <b>FrameCast</b>
  <span class="dot" id="dot"></span>
  <span id="hdrState" style="color:var(--dim);font-size:13px">belum terhubung</span>
  <span class="usr" id="usr"></span>
  <span class="badge" id="badge">PREMIUM</span>
</header>
<main>
  <div id="card">
    <div class="logo">🖥️ FrameCast</div>
    <div class="sub">Remote PC gratis (ID+PIN) · Remote HP premium (akun sama)</div>
    <div class="tabs">
      <div class="tab on" id="tabAcc" onclick="showTab('acc')">Akun</div>
      <div class="tab" id="tabPin" onclick="showTab('pin')">Cepat (ID+PIN)</div>
    </div>

    <!-- PANEL AKUN -->
    <div class="panel on" id="panel-acc">
      <div class="row">
        <input id="email" placeholder="Email" type="email" autocomplete="username">
      </div>
      <div class="row">
        <input id="pass" placeholder="Password" type="password" autocomplete="current-password">
        <button class="ghost" id="btnReg" style="width:90px" onclick="register()">Daftar</button>
      </div>
      <button id="btnLogin" onclick="login()">Masuk</button>
      <div id="devList"></div>
      <div style="font-size:12px;color:var(--dim);margin-top:10px;text-align:center">
        Login akun yang SAMA dengan device tujuan · HP = premium, PC = gratis
      </div>
    </div>

    <!-- PANEL PIN -->
    <div class="panel" id="panel-pin">
      <div class="row"><input id="id" placeholder="ID host (9 digit)" inputmode="numeric" autocomplete="off" maxlength="9"></div>
      <div class="row"><input id="pin" placeholder="PIN (bebas)" autocomplete="off"></div>
      <button id="btnConnect" onclick="quickConnect()">Connect</button>
      <div style="font-size:12px;color:var(--dim);margin-top:10px;text-align:center">
        Remote PC/desktop = GRATIS (ID+PIN)
      </div>
    </div>

    <div id="status"></div>
    <div id="err"></div>
  </div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="hint">klik/gambar = mouse · scroll = roda · keyboard = ketik</div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
