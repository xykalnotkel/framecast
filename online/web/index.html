<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameCast — Remote Desktop Online</title>
<style>
  :root { --bg:#0f1117; --card:#171b26; --line:#262c3b; --txt:#e6e9f2; --dim:#8b93a7; --acc:#4f7cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header b { letter-spacing:.3px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:#666; display:inline-block; }
  header .dot.on { background:#2fd06a; box-shadow:0 0 8px #2fd06a; }
  main { max-width:1080px; margin:0 auto; padding:16px; }
  #join { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  input, button { background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:8px;
    padding:10px 12px; font-size:15px; }
  input { min-width:130px; }
  input::placeholder { color:var(--dim); }
  button { cursor:pointer; background:var(--acc); border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { color:var(--dim); font-size:13px; margin:8px 0; min-height:18px; }
  #stage { position:relative; background:#000; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); aspect-ratio:16/9; display:none; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  #hint { position:absolute; left:10px; bottom:10px; color:#fff; background:rgba(0,0,0,.55);
    padding:4px 10px; border-radius:6px; font-size:12px; }
  #err { color:#ff6b6b; font-size:14px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<header>
  <b>FrameCast</b>
  <span class="dot" id="dot"></span>
  <span id="hdrState" style="color:var(--dim);font-size:13px">belum terhubung</span>
</header>
<main>
  <div id="join">
    <input id="id" placeholder="ID host, mis. 123 456 789" inputmode="numeric" autocomplete="off">
    <input id="pin" placeholder="PIN 6 digit" inputmode="numeric" autocomplete="off" maxlength="6">
    <button id="btn">Connect</button>
  </div>
  <div id="status"></div>
  <div id="err"></div>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="hint">klik/gambar = mouse · scroll = roda · keyboard = ketik</div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
