name: Build Host (Windows .exe)

# Jalan otomatis tiap push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-host.txt  # dxcam (DXGI capture) — windows
          pip install pyinstaller

      - name: Build host.exe dengan PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name FrameCastHost `
            --collect-all aiortc --collect-all av --collect-all pylibsrtp `
            online/host_rtc.py

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: FrameCastHost-windows
          path: dist/FrameCastHost.exe
          if-no-files-found: error
