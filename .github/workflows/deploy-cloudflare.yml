name: Deploy Cloudflare Worker

# Deploy signaling backend ke Cloudflare (gratis).
# Secret repo yang dipakai:
#   CLOUDFLARE_API_TOKEN          (wajib — token Workers/DO)
#   CLOUDFLARE_TURN_KEY_ID        (opsional — TURN key Cloudflare, fitur premium)
#   CLOUDFLARE_TURN_KEY_API_TOKEN (opsional)
# Catatan: secrets TIDAK boleh dipakai langsung di `if:` — makanya dipindah ke env.
on:
  push:
    branches: [main]
    paths: ['online/backend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TURN_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
      CF_TURN_TOKEN: ${{ secrets.CLOUDFLARE_TURN_KEY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy worker (wrangler)
        working-directory: online/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Set secret TURN_KEY_ID
        if: ${{ env.CF_TURN_ID != '' }}
        working-directory: online/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "$CF_TURN_ID" | npx --yes wrangler@4 secret put TURN_KEY_ID

      - name: Set secret TURN_KEY_API_TOKEN
        if: ${{ env.CF_TURN_TOKEN != '' }}
        working-directory: online/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "$CF_TURN_TOKEN" | npx --yes wrangler@4 secret put TURN_KEY_API_TOKEN

      - name: Cek URL worker
        run: |
          curl -s "https://framecast-signal.akuntiktok76y.workers.dev/api/host?id=000000000"
          echo " <- worker respons"
