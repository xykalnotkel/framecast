name: Build Android (APK)

on:
  push:
    branches: [main]
    paths: ['online/android/**']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & build APK
        working-directory: online/android
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameCastClient-debug.apk
          path: online/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
